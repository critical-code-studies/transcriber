<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2645"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#2fd3bd"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- sound: waveform bars -->
  <g fill="url(#sig)">
    <rect x="9"  y="27" width="4" height="10" rx="2"/>
    <rect x="15" y="19" width="4" height="26" rx="2"/>
    <rect x="21" y="13" width="4" height="38" rx="2"/>
    <rect x="27" y="22" width="4" height="20" rx="2"/>
  </g>
  <!-- text: lines of transcript -->
  <g fill="#e9eefb">
    <rect x="35" y="21" width="20" height="4" rx="2"/>
    <rect x="35" y="30" width="16" height="4" rx="2"/>
    <rect x="35" y="39" width="12" height="4" rx="2" opacity=".55"/>
  </g>
  <circle cx="51" cy="41" r="2" fill="#2fd3bd"/>
</svg>
